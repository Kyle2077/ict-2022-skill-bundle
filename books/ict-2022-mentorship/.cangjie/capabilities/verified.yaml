book:
  title: 开启ICT 2022导师计划的成功之门 / Unlocking Success in ICT 2022 Mentorship
  author: "LumiTraders (source: Michael J. Huddleston / Inner Circle Trader, 2022 Mentorship)"
  source_pack: src-ict2022
  baseline_tag: pdf-2023-12-31-671p
entry:
  name: ict-intraday-playbook
  description: ICT 2022 导师计划日内交易方法论的单一入口手册：以时间（Killzone/时段节奏）、价格（流动性与 PD Arrays）、结构（MSS/FVG/Displacement）三轴读取机构订单流，提供盘前过滤、价位锚、偏向判定、入场与风控的完整检查单与计算口径；不含投资建议，全部参数按原书口径标注品种与时区限制。
  core_principles:
    - 时间先于价格：先查时段窗口与禁忌日，再看任何形态
    - 价格只做两件事：重新平衡不平衡或寻求流动性（ERL/IRL 交替）
    - 结构必须带位移：无位移的突破不算 MSS，无位移本身是反向信号
    - 折价买入溢价卖出：不在旧高之上买、不在旧低之下卖
    - 不是每天都有交易：硬门不过即空仓
  out_of_scope:
    - 不提供投资建议或收益承诺；原书方法论无统计回测支持
    - 不覆盖加密货币等 24/7 品种的时段适配
    - 不处理跨品种点数换算（原书仅 ES 标定）
  stop_conditions:
    - 缺关键输入（日历、K线、锚数据）时先询问，不猜值
    - 禁忌日/硬门失败时输出不交易并停止下游能力
    - 时段口径存疑（夏令时）时显式声明约定后再执行
promotion_budget: 8
router_entry:
  name: ict-2022-mentorship-router
  description: "ICT 2022 导师计划蒸馏产物的来源路由入口：按意图把请求路由到 28 张能力卡（流动性/DOL、MSS、PD Array 词典、OTE、Turtle Soup、NY Scalp、SMT、Top Down 等），未单独晋级的能力经此入口可达，保证无能力失联。"
