    revision: 1
    status: active
    slug: session-taboo-filter
    title: 交易时段与禁忌日过滤
    importance: critical
    importance_rationale: 映射 task-01（错时段交易是全书首要亏损警告）；纯计算零主观，每日盘前必用
    one_liner: 先查五 Killzone 窗口与禁忌日/亚洲区间硬门，再允许任何入场分析
    intents: [今天几点可以交易, 现在是哪个时段, 今天有FOMC/NFP能不能做, 亚洲区间很宽还能做伦敦剧本吗]
    keywords: [killzone, session, 时段, 伦敦开盘, 纽约开盘, FOMC, NFP, 禁忌日, 亚洲区间, taboo day]
    also_read: [cap.ict2022.po3-amd-state-machine, cap.ict2022.high-probability-entry-risk]
    card: cards/session-taboo-filter.md
    resources: []
    visual_evidence: []
    frontmatter:
      description: 回答"现在/今天能不能交易、按哪个时段剧本"：五 Killzone 时间窗（纽约时间）、事件回避清单、亚洲区间阈值硬门、新闻前10分钟禁交易。触发词：时段/killzone/session/几点交易/新闻日/FOMC/NFP/亚洲区间。不回答方向与价位（→ daily-bias-checklist / daily-static-anchors）。
      tags: [time-filter, checklist, intraday]
    source_evidence:
      - source_id: src-ict2022
        location: Ch11 PDF p.155-180; Ch4 p.82-83; Ch9 p.116; Ch12 p.196
    promotion:
      destination: promoted
      gate: {independent_intent: true, independent_contract: true, independent_run: true, independent_reuse: true, independent_eval: true}
      notes: 每日盘前必调用；触发与路由入口可分（入口不答纯时段问题）
